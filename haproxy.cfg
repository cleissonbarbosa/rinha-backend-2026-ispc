global
    maxconn 20000
    nbthread 1
    tune.bufsize 16384
    hard-stop-after 1s

defaults
    mode tcp
    maxconn 20000
    timeout connect 50ms
    timeout client  60s
    timeout server  60s
    no log
    option dontlognull
    option splice-auto
    option tcp-smart-accept
    option tcp-smart-connect
    retries 0

frontend http_front
    bind *:9999
    maxconn 20000
    default_backend apis

backend apis
    balance roundrobin
    option tcp-check
    default-server maxconn 10000
    server api1 /sockets/api1.sock check inter 1s fall 2 rise 1
    server api2 /sockets/api2.sock check inter 1s fall 2 rise 1
