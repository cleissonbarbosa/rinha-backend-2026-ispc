global
    maxconn 20000
    nbthread 1

defaults
    mode http
    no log
    timeout connect 50ms
    timeout client 2s
    timeout server 2s
    timeout queue 2s
    retries 0

frontend http_front
    bind *:9999
    default_backend apis

backend apis
    balance roundrobin
    option httpchk GET /ready
    server api1 /sockets/api1.sock check inter 2s fall 3 rise 2
    server api2 /sockets/api2.sock check inter 2s fall 3 rise 2
