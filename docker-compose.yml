services:
  lb:
    image: cleissonb/rinha-backend-2026-ispc-lb:v0.3.0
    environment:
      BACKEND1: unix:/sockets/api1.sock
      BACKEND2: unix:/sockets/api2.sock
      LB_ADDR: 0.0.0.0
      LB_PORT: "9999"
    volumes:
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "50MB"
    networks:
      - rinha

  api1:
    image: cleissonb/rinha-backend-2026-ispc:v0.3.0
    command: ["/bin/sh", "-lc", "umask 000 && exec /app/rinha-server"]
    hostname: api1
    environment:
      - PORT=8080
      - SOCKET_PATH=/sockets/api1.sock
      - HTTP_THREADS=1
      - IO_BACKEND=uring
      - INSTANCE=api1
      - PROFILE=${PROFILE:-0}
      - PROFILE_LOG_EVERY=${PROFILE_LOG_EVERY:-10000}
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "150MB"
    networks:
      - rinha

  api2:
    image: cleissonb/rinha-backend-2026-ispc:v0.3.0
    command: ["/bin/sh", "-lc", "umask 000 && exec /app/rinha-server"]
    hostname: api2
    depends_on:
      - api1
    environment:
      - PORT=8080
      - SOCKET_PATH=/sockets/api2.sock
      - HTTP_THREADS=1
      - IO_BACKEND=uring
      - INSTANCE=api2
      - PROFILE=${PROFILE:-0}
      - PROFILE_LOG_EVERY=${PROFILE_LOG_EVERY:-10000}
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "150MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
