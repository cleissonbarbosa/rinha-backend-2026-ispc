services:
  lb:
    image: haproxy:3.3-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "50MB"
    networks:
      - rinha

  api1:
    image: cleissonb/rinha-backend-2026-ispc:v0.1.2
    command: ["/bin/sh", "-lc", "umask 000 && exec /app/rinha-server"]
    pull_policy: always
    hostname: api1
    environment:
      - PORT=8080
      - SOCKET_PATH=/sockets/api1.sock
      - HTTP_THREADS=1
      - INSTANCE=api1
      - PROFILE=${PROFILE:-0}
      - PROFILE_LOG_EVERY=${PROFILE_LOG_EVERY:-10000}
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

  api2:
    image: cleissonb/rinha-backend-2026-ispc:v0.1.2
    command: ["/bin/sh", "-lc", "umask 000 && exec /app/rinha-server"]
    hostname: api2
    pull_policy: always
    environment:
      - PORT=8080
      - SOCKET_PATH=/sockets/api2.sock
      - HTTP_THREADS=1
      - INSTANCE=api2
      - PROFILE=${PROFILE:-0}
      - PROFILE_LOG_EVERY=${PROFILE_LOG_EVERY:-10000}
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
